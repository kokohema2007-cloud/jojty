<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38091d"/>
      <stop offset="70%" stop-color="#1a040d"/>
      <stop offset="100%" stop-color="#0f0207"/>
    </radialGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0ea"/>
      <stop offset="40%" stop-color="#f5d3c3"/>
      <stop offset="75%" stop-color="#e0a384"/>
      <stop offset="100%" stop-color="#9c5938"/>
    </linearGradient>
    <linearGradient id="heartRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#be123c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGlow)"/>
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#roseGold)" stroke-width="2.5"/>
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#roseGold)" stroke-width="1" stroke-dasharray="3 3" opacity="0.6"/>

  <!-- Romantic Heart Silhouette with Metallic Border -->
  <g filter="url(#softGlow)">
    <path d="M64,98 C64,98 22,72 22,46 C22,30 35,20 48,20 C56,20 62,25 64,30 C66,25 72,20 80,20 C93,20 106,30 106,46 C106,72 64,98 64,98 Z" 
          fill="url(#heartRuby)" stroke="url(#roseGold)" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- Sparkle Accent Top Right -->
  <path d="M96,22 Q96,30 104,30 Q96,30 96,38 Q96,30 88,30 Q96,30 96,22 Z" fill="url(#roseGold)"/>
  <!-- Sparkle Accent Bottom Left -->
  <path d="M30,76 Q30,81 35,81 Q30,81 30,86 Q30,81 25,81 Q30,81 30,76 Z" fill="url(#roseGold)" opacity="0.85"/>
</svg>
